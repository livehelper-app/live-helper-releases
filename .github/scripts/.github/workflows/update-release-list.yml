name: Update the release list

# Rewrites the list between the releases markers in README.md. It lists only releases that are public, because visitors cannot
# open a draft. It commits only when the list changed.

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

# One run at a time, so two runs never push over each other. A run always reads the releases fresh, so a skipped run loses nothing.
concurrency:
  group: readme-releases
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A release event starts on the tag. Work on the default branch, so the push has somewhere to go.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: List the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/releases.json"

      - name: Rewrite the list in README.md
        run: python3 .github/scripts/readme_releases.py README.md < "${RUNNER_TEMP}/releases.json"

      - name: Commit and push when the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update the list of latest releases"
          git push
